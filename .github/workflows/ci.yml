name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 静态检查
        run: go vet -tags with_gvisor ./...

      - name: 编译（含 gVisor 用户态协议栈）
        run: go build -tags with_gvisor ./...

      - name: 单元测试
        run: go test -tags with_gvisor ./...
